[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-local"
version = "0.0.0"
description = "Local-first, deterministic and verifiable data intelligence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.5",
    "pydantic==2.14.4",
    "scikit-learn==1.9.1",
    "threadpoolctl==3.8.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/axiom", "src/axiom_router", "src/axbench", "src/axbench_tr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# EXP-TR04 modules carry long audit-statement strings that are written verbatim into the
# generated, hashed reports; wrapping them would only obscure the text.
"src/axbench_tr/tr04*.py" = ["E501"]
