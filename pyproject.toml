[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-local"
version = "0.0.0"
description = "Local-first, deterministic and verifiable data intelligence (bootstrap placeholder)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
